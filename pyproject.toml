[project]
name = "mat1510-project"
version = "0.1.0"
description = "Reasoning Graph Analysis - Entropy patterns in LLM reasoning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.3.0",
    "imageio>=2.37.0",
    "ipython>=8.18.0",
    "math-verify>=0.8.0",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "requests>=2.32.5",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "sympy>=1.14.0",
    "torch>=2.8.0",
    "transformers>=4.57.0",
    "tqdm>=4.66.0",
]

[project.scripts]
mat1510-experiment = "mat1510.experiment.runner:main"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
